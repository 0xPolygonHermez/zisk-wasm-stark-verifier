[package]
name = "zisk-wasm-stark-verifier"
version = "0.1.0"
edition = "2021"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
zisk-verifier = { git = "https://github.com/0xPolygonHermez/zisk.git", tag = "v1.1.0-alpha" }

# Wasm bindings
wasm-bindgen = "0.2"


# Error handling
anyhow = "1.0"

# Console logging for debugging
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
  "console",
]

# Optimize for size in release builds
[profile.release]
opt-level = "s"
lto = true
